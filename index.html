<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Simulación de una sala con una aspiradora robot que traza el camino hacia el sofá, la lámpara y la mesa, mostrando distancia y vectores.">
<title>Sala con aspiradora robot</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ec;--fg:#222;--card:#fff;--muted:#666}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b1a;--fg:#eee;--card:#2a2826;--muted:#aaa}}
:root[data-theme="dark"]{--bg:#1c1b1a;--fg:#eee;--card:#2a2826;--muted:#aaa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px}
h1{font-size:18px;margin:0 0 4px}
p{margin:0 0 10px;color:var(--muted);font-size:14px}
.wrap{max-width:720px;margin:0 auto}
canvas{width:100%;height:auto;display:block;border-radius:12px;touch-action:manipulation;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.bar button{flex:1;min-width:90px;padding:10px;border:0;border-radius:8px;background:var(--card);color:var(--fg);font-size:14px;cursor:pointer}
#info{margin-top:10px;padding:10px 12px;background:var(--card);border-radius:8px;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
<h1>🏠 Sala con aspiradora robot</h1>
<p>Toca un mueble (o cualquier punto libre) y el robot trazará el camino. Si vas a la mesa, el camino será rojo.</p>
<canvas id="c" width="700" height="480"></canvas>
<div class="bar">
<button data-t="sofa">🛋️ Sofá</button>
<button data-t="lamp">💡 Lámpara</button>
<button data-t="table">🍽️ Mesa</button>
<button data-t="home">🔌 Base</button>
<button data-t="tour" style="flex-basis:100%;background:#2b7fff;color:#fff">🧭 Recorrido: sofá → lámpara → mesa</button>
<button data-t="vec" style="flex-basis:100%">➡️ Vectores: sí</button>
<button data-t="clear" style="flex-basis:100%">🧹 Borrar líneas</button>
</div>
<div id="info">Esperando destino…</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),info=document.getElementById('info');
const W=700,H=480,CELL=10,PXM=50,R=14; // 50 px = 1 m
const objs={
  sofa:{x:70,y:60,w:110,h:90,name:'Sofá'},
  table:{x:400,y:200,w:130,h:80,name:'Mesa'},
  lamp:{x:610,y:70,r:18,name:'Lámpara'}
};
const home={x:80,y:400};
let trail=[],tourTotal=0,showVec=true;
let robot={x:home.x,y:home.y},path=[],pathColor='#2b7fff',target=null,moving=false;

function inObj(o,px,py,m){ if(o.r) return Math.hypot(px-(o.x),py-(o.y))<o.r+m;
  return px>o.x-m&&px<o.x+o.w+m&&py>o.y-m&&py<o.y+o.h+m;}
function blocked(px,py){ if(px<R||py<R||px>W-R||py>H-R) return true;
  return Object.values(objs).some(o=>inObj(o,px,py,R)); }
const cols=W/CELL,rows=H/CELL;
const grid=[];for(let j=0;j<rows;j++){grid[j]=[];for(let i=0;i<cols;i++)grid[j][i]=blocked(i*CELL+5,j*CELL+5);}
const cellOf=(x,y)=>[Math.min(cols-1,Math.max(0,Math.floor(x/CELL))),Math.min(rows-1,Math.max(0,Math.floor(y/CELL)))];
function nearestFree(x,y){let best=null,bd=1e9;
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++)if(!grid[j][i]){const d=Math.hypot(i*CELL+5-x,j*CELL+5-y);if(d<bd){bd=d;best=[i,j];}}
  return best;}
function astar(s,g){
  const key=(i,j)=>j*cols+i,open=[{i:s[0],j:s[1],g:0,f:0}],came={},gs={[key(...s)]:0},closed=new Set();
  const h=(i,j)=>Math.hypot(i-g[0],j-g[1]);
  while(open.length){
    open.sort((a,b)=>a.f-b.f);const c=open.shift(),ck=key(c.i,c.j);
    if(c.i===g[0]&&c.j===g[1]){const p=[[c.i,c.j]];let k=ck;while(came[k]!==undefined){k=came[k];p.push([k%cols,Math.floor(k/cols)]);}return p.reverse();}
    if(closed.has(ck))continue;closed.add(ck);
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){
      if(!di&&!dj)continue;const ni=c.i+di,nj=c.j+dj;
      if(ni<0||nj<0||ni>=cols||nj>=rows||grid[nj][ni])continue;
      if(di&&dj&&(grid[c.j][ni]||grid[nj][c.i]))continue;
      const ng=c.g+Math.hypot(di,dj),nk=key(ni,nj);
      if(gs[nk]===undefined||ng<gs[nk]){gs[nk]=ng;came[nk]=ck;open.push({i:ni,j:nj,g:ng,f:ng+h(ni,nj)});}
    }}
  return null;}
function los(a,b){const n=Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/4);
  for(let k=0;k<=n;k++){const t=k/n;if(blocked(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t))return false;}return true;}
function smooth(p){const out=[p[0]];let i=0;
  while(i<p.length-1){let j=p.length-1;while(j>i+1&&!los(p[i],p[j]))j--;out.push(p[j]);i=j;}return out;}
function goTo(x,y,label,isTable,done,keep){
  if(moving)return;
  const s=nearestFree(robot.x,robot.y),g=nearestFree(x,y);
  const raw=astar(s,g);if(!raw){info.textContent='No hay camino disponible.';return;}
  let pts=raw.map(([i,j])=>({x:i*CELL+5,y:j*CELL+5}));
  pts[0]={x:robot.x,y:robot.y};
  pts=smooth(pts);
  path=pts;pathColor=isTable?'#e11d1d':'#2b7fff';target=label;
  let len=0;for(let k=1;k<pts.length;k++)len+=Math.hypot(pts[k].x-pts[k-1].x,pts[k].y-pts[k-1].y);
  const va=pts[0],vb=pts[pts.length-1],vx=(vb.x-va.x)/PXM,vy=-(vb.y-va.y)/PXM;
  info.innerHTML=`Destino: <b>${label}</b> — Distancia recorrida: <b>${(len/PXM).toFixed(2)} m</b><br>Vector desplazamiento: <b>(${vx.toFixed(2)}, ${vy.toFixed(2)}) m</b> — módulo ${Math.hypot(vx,vy).toFixed(2)} m, ángulo ${((Math.atan2(vy,vx)*180/Math.PI+360)%360).toFixed(0)}°`;
  if(keep)tourTotal+=len;else trail=[];
  moving=true;animate(pts,()=>{trail.push({pts,color:pathColor,len});if(done)done();});
}
function animate(pts,done){let k=1;
  function step(){
    if(k>=pts.length){moving=false;path=[];if(done)done();return;}
    const t=pts[k],dx=t.x-robot.x,dy=t.y-robot.y,d=Math.hypot(dx,dy),sp=2.5;
    if(d<=sp){robot.x=t.x;robot.y=t.y;k++;}else{robot.x+=dx/d*sp;robot.y+=dy/d*sp;robot.a=Math.atan2(dy,dx);}
    // recorta el camino ya recorrido
    path=[{x:robot.x,y:robot.y},...pts.slice(k)];
    requestAnimationFrame(step);}
  step();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function buildBg(){const c=bg.getContext('2d');
  // tablones de madera
  const ph=32;
  for(let y=0,row=0;y<H;y+=ph,row++){let x=-rnd()*160;
    while(x<W){const pw=150+rnd()*110,l=40+rnd()*14;
      c.fillStyle=`hsl(${28+rnd()*6},${42+rnd()*8}%,${l}%)`;c.fillRect(x,y,pw,ph);
      c.strokeStyle='rgba(60,35,15,.18)';for(let k=0;k<5;k++){c.beginPath();const gy=y+4+rnd()*(ph-8);c.moveTo(x+4,gy);c.bezierCurveTo(x+pw*.3,gy+rnd()*4-2,x+pw*.7,gy+rnd()*4-2,x+pw-4,gy);c.stroke();}
      c.strokeStyle='rgba(30,15,5,.5)';c.lineWidth=1.2;c.strokeRect(x,y,pw,ph);
      x+=pw;}}
  // luz general
  const g=c.createRadialGradient(W/2,H/2,80,W/2,H/2,460);g.addColorStop(0,'rgba(255,230,180,.10)');g.addColorStop(1,'rgba(20,10,0,.35)');c.fillStyle=g;c.fillRect(0,0,W,H);
  // luz de ventana
  c.fillStyle='rgba(255,250,220,.16)';c.beginPath();c.moveTo(250,12);c.lineTo(390,12);c.lineTo(470,200);c.lineTo(300,200);c.closePath();c.fill();
  // alfombra
  c.save();c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=14;c.shadowOffsetY=3;c.fillStyle='#8c3b3b';rr2(c,320,140,290,220,14);c.fill();c.restore();
  c.fillStyle='#a74a44';rr2(c,332,152,266,196,8);c.fill();
  c.strokeStyle='#e8d2a6';c.lineWidth=3;rr2(c,342,162,246,176,5);c.stroke();
  c.strokeStyle='rgba(232,210,166,.55)';c.lineWidth=1.5;
  for(let i=0;i<5;i++){c.beginPath();c.moveTo(465,175+i*0);c.restore&&0;}
  c.beginPath();c.moveTo(465,172);c.lineTo(578,250);c.lineTo(465,328);c.lineTo(352,250);c.closePath();c.stroke();
  c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=1.5;
  for(let x=324;x<606;x+=6){c.beginPath();c.moveTo(x,140);c.lineTo(x,134);c.moveTo(x,360);c.lineTo(x,366);c.stroke();}
  // paredes
  c.fillStyle='#d9d2c5';c.fillRect(0,0,W,12);c.fillRect(0,0,12,H);c.fillRect(W-12,0,12,H);c.fillRect(0,H-12,W,12);
  c.fillStyle='#f4efe6';c.fillRect(12,12,W-24,4);c.fillRect(12,12,4,H-24);c.fillRect(W-16,12,4,H-24);c.fillRect(12,H-16,W-24,4);
  c.fillStyle='rgba(0,0,0,.25)';c.fillRect(16,16,W-32,5);c.fillRect(16,16,5,H-32);
  // ventana
  c.fillStyle='#9fd3ee';c.fillRect(260,0,120,12);c.strokeStyle='#fff';c.lineWidth=3;c.strokeRect(260,1,120,10);c.beginPath();c.moveTo(320,0);c.lineTo(320,12);c.stroke();
  // puerta
  c.fillStyle='#7b5230';c.fillRect(540,H-12,90,12);c.fillStyle='#d9b24c';c.fillRect(612,H-9,6,6);
})();
function rr2(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);}
function arrow(a,b,col,w,head){const ang=Math.atan2(b.y-a.y,b.x-a.x);
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;ctx.setLineDash([]);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x-Math.cos(ang)*head*.6,b.y-Math.sin(ang)*head*.6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-head*Math.cos(ang-.4),b.y-head*Math.sin(ang-.4));ctx.lineTo(b.x-head*Math.cos(ang+.4),b.y-head*Math.sin(ang+.4));ctx.closePath();ctx.fill();}
function drawSegs(pts){for(let k=1;k<pts.length;k++){const a=pts[k-1],b=pts[k];if(Math.hypot(b.x-a.x,b.y-a.y)<12)continue;arrow(a,b,'#111',5,13);arrow(a,b,'#fff',2.5,9);}}
function drawVec(tr){drawSegs(tr.pts);
  const a=tr.pts[0],b=tr.pts[tr.pts.length-1],d=Math.hypot(b.x-a.x,b.y-a.y);if(d<20)return;
  ctx.save();ctx.setLineDash([4,4]);ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,.85)';
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore();
  arrow(a,b,'#111',6,15);arrow(a,b,'#22c55e',3.5,11);
  const vx=(b.x-a.x)/PXM,vy=-(b.y-a.y)/PXM,th=(Math.atan2(vy,vx)*180/Math.PI+360)%360;
  const txt=`R=${(d/PXM).toFixed(2)} m (${vx.toFixed(1)}, ${vy.toFixed(1)}) ${th.toFixed(0)}°`;
  const nx=-(b.y-a.y)/d,ny=(b.x-a.x)/d;ctx.font='600 11px system-ui';const tw=ctx.measureText(txt).width+10;
  const lx=Math.min(W-tw/2-4,Math.max(tw/2+4,(a.x+b.x)/2+nx*24)),ly=(a.y+b.y)/2+ny*24;
  ctx.fillStyle='rgba(0,0,0,.72)';rr(lx-tw/2,ly-11,tw,16,8);ctx.fill();ctx.fillStyle='#86efac';ctx.textAlign='center';ctx.fillText(txt,lx,ly+1);}
function shadow(on){if(on){ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=16;ctx.shadowOffsetX=5;ctx.shadowOffsetY=8;}else{ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;}}
function label(txt,x,y){ctx.font='600 11px system-ui';ctx.textAlign='center';ctx.fillStyle='rgba(0,0,0,.55)';const w=ctx.measureText(txt).width+10;rr(x-w/2,y-11,w,16,8);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(txt,x,y);}
let dash=0;
function draw(){
  ctx.drawImage(bg,0,0);
  // base de carga
  shadow(true);ctx.fillStyle='#e9e9ec';rr(home.x-24,home.y+12,48,16,6);ctx.fill();shadow(false);
  ctx.fillStyle='#3ddc84';ctx.fillRect(home.x-14,home.y+18,28,3);label('base',home.x,home.y+44);
  // sofá individual
  const s=objs.sofa;shadow(true);ctx.fillStyle='#4a3a66';rr(s.x,s.y,s.w,s.h,16);ctx.fill();shadow(false);
  let gr=ctx.createLinearGradient(s.x,s.y,s.x,s.y+22);gr.addColorStop(0,'#6a5590');gr.addColorStop(1,'#4f3f73');
  ctx.fillStyle=gr;rr(s.x,s.y,s.w,26,[16,16,6,6]);ctx.fill();               // respaldo
  ctx.fillStyle='#5b4880';rr(s.x,s.y+18,20,s.h-18,[8,8,14,14]);ctx.fill();rr(s.x+s.w-20,s.y+18,20,s.h-18,[8,8,14,14]);ctx.fill(); // brazos
  gr=ctx.createLinearGradient(0,s.y+26,0,s.y+s.h);gr.addColorStop(0,'#7e69a8');gr.addColorStop(1,'#6a5590');
  ctx.fillStyle=gr;rr(s.x+20,s.y+26,s.w-40,s.h-30,10);ctx.fill();            // cojín
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#e6b94a';ctx.save();ctx.translate(s.x+s.w-34,s.y+42);ctx.rotate(.3);rr(-13,-13,26,26,5);ctx.fill();ctx.restore(); // almohada
  label('Sofá',s.x+s.w/2,s.y+s.h+16);
  // mesa
  const t=objs.table;shadow(true);ctx.fillStyle='#5c3a1c';rr(t.x,t.y,t.w,t.h,10);ctx.fill();shadow(false);
  gr=ctx.createLinearGradient(t.x,t.y,t.x+t.w,t.y+t.h);gr.addColorStop(0,'#b07a42');gr.addColorStop(.5,'#c18c52');gr.addColorStop(1,'#a56f3a');
  ctx.fillStyle=gr;rr(t.x+4,t.y+4,t.w-8,t.h-8,8);ctx.fill();
  ctx.strokeStyle='rgba(80,45,15,.25)';ctx.lineWidth=1;for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(t.x+8,t.y+4+i*(t.h-8)/6);ctx.lineTo(t.x+t.w-8,t.y+4+i*(t.h-8)/6);ctx.stroke();}
  ctx.fillStyle='#2f6f5e';rr(t.x+16,t.y+22,34,24,3);ctx.fill();ctx.fillStyle='#f2ead3';rr(t.x+18,t.y+24,30,3,1);ctx.fill();          // libro
  shadow(true);ctx.fillStyle='#e8eef2';ctx.beginPath();ctx.arc(t.x+t.w-34,t.y+t.h/2,13,0,7);ctx.fill();shadow(false);               // florero
  ctx.fillStyle='#4b9b4b';for(let k=0;k<6;k++){ctx.beginPath();ctx.ellipse(t.x+t.w-34+Math.cos(k)*7,t.y+t.h/2+Math.sin(k)*7,6,3,k,0,7);ctx.fill();}
  ctx.fillStyle='#e0527a';ctx.beginPath();ctx.arc(t.x+t.w-34,t.y+t.h/2,4,0,7);ctx.fill();
  label('Mesa',t.x+t.w/2,t.y+t.h+16);
  // lámpara de pie (vista superior)
  const l=objs.lamp;const lg=ctx.createRadialGradient(l.x,l.y,4,l.x,l.y,95);lg.addColorStop(0,'rgba(255,225,140,.55)');lg.addColorStop(1,'rgba(255,225,140,0)');
  ctx.fillStyle=lg;ctx.beginPath();ctx.arc(l.x,l.y,95,0,7);ctx.fill();
  shadow(true);ctx.fillStyle='#e9c25a';ctx.beginPath();ctx.arc(l.x,l.y,l.r,0,7);ctx.fill();shadow(false);
  const sg=ctx.createRadialGradient(l.x-5,l.y-5,2,l.x,l.y,l.r);sg.addColorStop(0,'#fff3c4');sg.addColorStop(1,'#d9a93a');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(l.x,l.y,l.r-2,0,7);ctx.fill();
  ctx.fillStyle='#4a4036';ctx.beginPath();ctx.arc(l.x,l.y,4,0,7);ctx.fill();label('Lámpara',l.x,l.y+l.r+18);
  // recorridos que se quedan
  trail.forEach((tr,idx)=>{
    ctx.lineJoin='round';ctx.lineCap='round';
    const line=()=>{ctx.beginPath();tr.pts.forEach((p,k)=>k?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();};
    ctx.strokeStyle=tr.color+'55';ctx.lineWidth=10;ctx.setLineDash([]);line();
    ctx.strokeStyle=tr.color;ctx.lineWidth=4;ctx.setLineDash([10,6]);ctx.lineDashOffset=0;line();ctx.setLineDash([]);
    const e=tr.pts[tr.pts.length-1];
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x,e.y,12,0,7);ctx.fill();
    ctx.fillStyle=tr.color;ctx.beginPath();ctx.arc(e.x,e.y,10,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(String(idx+1),e.x,e.y+4);
    const m=tr.pts[Math.floor(tr.pts.length/2)],txt=(tr.len/PXM).toFixed(2)+' m',tw=ctx.measureText(txt).width+14;
    shadow(true);ctx.fillStyle=tr.color;rr(m.x-tw/2,m.y-28,tw,22,11);ctx.fill();shadow(false);
    ctx.fillStyle='#fff';ctx.fillText(txt,m.x,m.y-12);
  });
  if(showVec){trail.forEach(drawVec);if(path.length>1)drawSegs(path);}
  // camino
  if(path.length>1){
    dash=(dash+.8)%16;
    ctx.lineJoin='round';ctx.lineCap='round';
    ctx.strokeStyle=pathColor+'55';ctx.lineWidth=10;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(let k=1;k<path.length;k++)ctx.lineTo(path[k].x,path[k].y);ctx.stroke();
    ctx.strokeStyle=pathColor;ctx.lineWidth=4;ctx.setLineDash([10,6]);ctx.lineDashOffset=-dash;
    ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(let k=1;k<path.length;k++)ctx.lineTo(path[k].x,path[k].y);ctx.stroke();ctx.setLineDash([]);
    const e=path[path.length-1];ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x,e.y,9,0,7);ctx.fill();ctx.fillStyle=pathColor;ctx.beginPath();ctx.arc(e.x,e.y,6,0,7);ctx.fill();
    let len=0;for(let k=1;k<path.length;k++)len+=Math.hypot(path[k].x-path[k-1].x,path[k].y-path[k-1].y);
    const m=path[Math.floor(path.length/2)],txt=(len/PXM).toFixed(2)+' m';
    ctx.font='bold 13px system-ui';const tw=ctx.measureText(txt).width+14;
    shadow(true);ctx.fillStyle=pathColor;rr(m.x-tw/2,m.y-28,tw,22,11);ctx.fill();shadow(false);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(txt,m.x,m.y-12);
  }
  // aspiradora robot
  ctx.save();ctx.translate(robot.x,robot.y);ctx.rotate(robot.a||0);
  shadow(true);ctx.fillStyle='#1d1f24';ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();shadow(false);
  let rg=ctx.createRadialGradient(-4,-4,2,0,0,R);rg.addColorStop(0,'#f4f5f7');rg.addColorStop(1,'#b9bcc4');
  ctx.fillStyle=rg;ctx.beginPath();ctx.arc(0,0,R-1.5,0,7);ctx.fill();
  ctx.strokeStyle='#3ddc84';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,R-4,-.9,.9);ctx.stroke();       // LED
  ctx.fillStyle='#2a2d33';ctx.beginPath();ctx.arc(-2,0,4.5,0,7);ctx.fill();ctx.fillStyle='#555a63';ctx.beginPath();ctx.arc(-2,0,2,0,7);ctx.fill(); // lidar
  ctx.fillStyle='#2a2d33';ctx.fillRect(R-5,-5,4,10);                                                      // sensor frontal
  ctx.strokeStyle='#3b3f47';ctx.lineWidth=1.5;for(let k=0;k<4;k++){const an=2.3+k*.5;ctx.beginPath();ctx.moveTo(Math.cos(an)*R,Math.sin(an)*R);ctx.lineTo(Math.cos(an)*(R+4),Math.sin(an)*(R+4));ctx.stroke();} // cepillo
  ctx.restore();
}
(function loop(){draw();requestAnimationFrame(loop);})();
function tour(){
  if(moving)return;trail=[];tourTotal=0;
  const seq=['sofa','lamp','table'];let i=0;
  (function next(){
    if(i>=seq.length){info.innerHTML=`Recorrido completo — Distancia total: <b>${(tourTotal/PXM).toFixed(2)} m</b>`;return;}
    const k=seq[i++],o=objs[k];
    goTo(o.r?o.x:o.x+o.w/2,o.r?o.y:o.y+o.h/2,o.name,k==='table',next,true);
  })();
}
function pos(e){const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;
  return {x:(p.clientX-r.left)*W/r.width,y:(p.clientY-r.top)*H/r.height};}
cv.addEventListener('click',e=>{
  const p=pos(e);
  for(const k of ['sofa','table','lamp']){const o=objs[k];
    const hit=o.r?Math.hypot(p.x-o.x,p.y-o.y)<o.r+4:(p.x>=o.x&&p.x<=o.x+o.w&&p.y>=o.y&&p.y<=o.y+o.h);
    if(hit)return goTo(o.r?o.x:o.x+o.w/2,o.r?o.y:o.y+o.h/2,o.name,k==='table');}
  goTo(p.x,p.y,'punto libre',false);
});
document.querySelectorAll('button[data-t]').forEach(b=>b.onclick=()=>{
  const k=b.dataset.t;if(k==='vec'){showVec=!showVec;b.textContent='➡️ Vectores: '+(showVec?'sí':'no');return;}if(k==='tour')return tour();if(k==='clear'){if(!moving){trail=[];info.textContent='Líneas borradas.';}return;}if(k==='home')return goTo(home.x,home.y,'Base',false);
  const o=objs[k];goTo(o.r?o.x:o.x+o.w/2,o.r?o.y:o.y+o.h/2,o.name,k==='table');});
</script>
